let selectedStep='FOB',drawerReturnFocus=null,routeMemory={path:'/visao-geral',params:new URLSearchParams()},urlListenerReady=false,urlReadOnce=false;
function syncUrl(action='write',nextPath=null,nextParams=null){try{let available=false;try{available=location.protocol.startsWith('http')&&!location.href.startsWith('about:')}catch{}if(action==='read'){if(!available&&urlReadOnce)return routeMemory;let raw='#/visao-geral';if(available)raw=location.hash||raw;const value=raw.slice(1),[path,query='']=value.split('?'),valid=Object.values(routeRegistry).some(r=>r.path===path);routeMemory={path:valid?path:'/visao-geral',params:new URLSearchParams(valid?query:value)};urlReadOnce=true;return routeMemory}if(action==='listen'){if(available&&!urlListenerReady){window.addEventListener('hashchange',()=>{syncUrl('read');restoreRouteFilters();render()});urlListenerReady=true}return available}if(nextPath)routeMemory={path:nextPath,params:new URLSearchParams(nextParams||'')};const params=new URLSearchParams();Object.entries(current()).forEach(([k,v])=>{if(v)params.set(k==='tri'?'trimestre':k,v)});if(routeMemory.params.has('id'))params.set('id',routeMemory.params.get('id'));routeMemory.params=params;if(available){const query=params.toString();history.replaceState(null,'',routeMemory.path+(query?'?'+query:''))}return true}catch{return false}}

function goRoute(name,params={}){const query=new URLSearchParams();Object.entries(current()).forEach(([k,v])=>{if(v)query.set(k==='tri'?'trimestre':k,v)});Object.entries(params).forEach(([k,v])=>{if(v)query.set(k,v)});syncUrl('write',routeRegistry[name].path,query);render()}

function restoreRouteFilters(){const {params}=routeState();[['pais','pais'],['material','material'],['ano','ano'],['tri','trimestre']].forEach(([id,k])=>{if(params.has(k)&&[...$(id).options].some(o=>o.value===params.get(k)))$(id).value=params.get(k)});}
const _renderDashboard=render;function showRenderError(error){console.error('Não foi possível montar a tela',error);const app=$('app');if(!app)return;app.innerHTML=`<section class="card error-card" role="alert"><h2>Não foi possível montar a tela</h2><p>${esc(error?.name||'Erro')}: ${esc(error?.message||String(error))}</p><button id="render-retry" type="button">Tentar montar novamente</button></section>`;$('render-retry').onclick=()=>render()}render=function(){try{_renderDashboard();syncUrl('write');renderRoute()}catch(error){showRenderError(error)}};
let renderedRoute=null;function renderRoute(){const state=routeState(),name=Object.keys(routeRegistry).find(k=>routeRegistry[k].path===state.path)||'visao',app=$('app'),all=app.innerHTML;document.querySelectorAll('.nav-link').forEach(b=>{const active=b.dataset.route===name;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const pageTitle=name==='cascata'||name==='importacao'?'Anatomia da operação':routeRegistry[name].title;document.querySelector('.screen-title').textContent=routeRegistry[name].title;document.querySelector('.crumb').textContent=name==='cascata'?'Anatomia da operação › Do FOB ao custo em R$':name==='importacao'?'Anatomia da operação › Uma importação por vez':name==='visao'?'Visão geral':'Importações';document.title=routeRegistry[name].title+' | Gutenberg Systems';if(name==='visao'){const tmp=document.createElement('div');tmp.innerHTML=all;tmp.querySelector('section.card.section:last-child')?.remove();app.innerHTML=tmp.innerHTML;}else if(name==='importacoes'){const tmp=document.createElement('div');tmp.innerHTML=all;const table=[...tmp.querySelectorAll('section.card.section')].at(-1);app.innerHTML='';if(table){app.insertAdjacentHTML('afterbegin',`<section class="card route-summary"><span>Total do recorte</span><strong>${money(sum(filtered))}</strong><small>${filtered.length} de ${rows.length} importações</small></section>`);app.append(table)}else app.innerHTML='<p>Nenhuma importação encontrada.</p>';}else if(name==='cascata')renderCascade();else renderOneImport(state.params.get('id')||'');if(renderedRoute!==null&&renderedRoute!==name)document.querySelector('.screen-title').focus({preventScroll:true});renderedRoute=name;}
function renderCascade(){const total=sum(filtered),items=[['FOB',r=>r.fob*r.cambio],['Frete',r=>r.frete*r.cambio],['Seguro',r=>r.seguro*r.cambio],['Base de cálculo',r=>(r.fob+r.frete+r.seguro)*r.cambio],['II',r=>taxPiece(r,0)],['IPI',r=>taxPiece(r,1)],['PIS/COFINS',r=>taxPiece(r,2)],['Custo total (R$)',r=>r.total/100]], vals=items.map(([name,fn])=>({name,value:filtered.reduce((s,r)=>s+fn(r),0)})),base=vals[3].value,steps=vals[4].value+vals[5].value+vals[6].value,delta=Math.round((vals[3].value+steps)*100)-total;const info=vals.find(v=>v.name===selectedStep);$('app').innerHTML=`<section class="card route-panel"><div class="card-head"><div><h2>Como cada parcela forma o custo final</h2><p class="sub">Valores do filtro atual · reais (R$)</p></div><button id="cascade-how" aria-expanded="false">Como foi calculado</button><button id="cascade-table-toggle">Ver como tabela</button></div><p class="how" id="cascade-help">Cada etapa soma o valor em US$ multiplicado pelo câmbio da própria importação. Encargos são distribuídos entre os impostos proporcionalmente às alíquotas fictícias.</p><div class="step-grid"><div><div class="step-list">${vals.map(v=>`<button class="step-button" data-step="${esc(v.name)}"><strong>${esc(v.name)}</strong><span>${money(Math.round(v.value*100))} · ${pct.format(total?v.value/(total/100):0)}</span></button>`).join('')}</div><p>Encargos somam ${pct.format(total?steps/(total/100):0)} do custo; frete e seguro, ${pct.format(total?(vals[1].value+vals[2].value)/(total/100):0)}. Os dados são fictícios.</p>${delta?`<p>Diferença de arredondamento: ${money(delta)}</p>`:''}<div id="cascade-table" class="chart-table"><table><thead><tr><th>Etapa</th><th>Valor (R$)</th><th>% do custo</th></tr></thead><tbody>${vals.map(v=>`<tr><td>${esc(v.name)}</td><td>${money(Math.round(v.value*100))}</td><td>${pct.format(total?v.value/(total/100):0)}</td></tr>`).join('')}</tbody></table></div></div><aside class="card"><h2>${esc(info.name)}</h2><p>${stepExplanation(info.name)}</p><p>Regra: ${stepRule(info.name)}. Alíquotas fictícias neste projeto.</p></aside></div></section>`;document.getElementById('cascade-how').onclick=()=>toggleHow('cascade-help','cascade-how');document.getElementById('cascade-table-toggle').onclick=()=>toggleTable('cascade-table');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{selectedStep=b.dataset.step;renderCascade()});}
function taxPiece(r,i){const rates=[r.aliq_ii_pct,r.aliq_ipi_pct,r.aliq_pis_cofins_pct].map(num),den=rates.reduce((a,b)=>a+b,0);return den?(r.encargos*r.cambio*rates[i]/den):0}
function stepExplanation(s){return s==='II'?'O II incide sobre a base de cálculo. Alíquotas fictícias neste projeto: China 14%, Índia 12%, Alemanha 10%, EUA 10%, Vietnã 13%.':`A etapa ${s} é apresentada como parcela agregada no recorte selecionado. Todos os dados e alíquotas são fictícios.`}
function stepRule(s){return s==='Custo total (R$)'?'soma exata do campo custo_total_brl em centavos inteiros':s==='Base de cálculo'?'(FOB + frete + seguro) × câmbio da linha':s==='II'||s==='IPI'||s==='PIS/COFINS'?'encargos USD × alíquota da etapa ÷ soma das alíquotas × câmbio':'valor em USD × câmbio da própria linha, somado no recorte'}
function renderOneImport(id){const matches=filtered.filter(r=>!id||r.id===id),r=matches[0];$('app').innerHTML=`<section class="card route-panel"><h2>Uma importação por vez</h2><div class="field"><label for="import-search">Buscar ou selecionar por ID</label><input id="import-search" list="import-ids" value="${esc(id)}" placeholder="IMP-0001"><datalist id="import-ids">${filtered.map(x=>`<option value="${esc(x.id)}">`).join('')}</datalist></div>${!r?'<p>Nenhuma importação para estes filtros ou ID.</p>':receiptHTML(r)}</section>`;const input=document.getElementById('import-search');input.onchange=()=>goRoute('importacao',{id:input.value});}
function receiptHTML(r){const usd=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'USD'}).format(n),base=(r.fob+r.frete+r.seguro),calc=Math.round((base+r.encargos)*r.cambio*100),diff=calc-r.total;return `<article class="card receipt"><h2>Recibo · ${esc(r.id)}</h2>${[['Data',`${r.day}/${r.month}/${r.year}`],['País',r.pais],['Fornecedor',r.fornecedor],['Material',r.material],['FOB',usd(r.fob)],['Frete',usd(r.frete)],['Seguro',usd(r.seguro)],['Base de cálculo',usd(base)],['Encargos',usd(r.encargos)],['Subtotal em US$',usd(base+r.encargos)],['Câmbio',nfmt.format(r.cambio)]].map(([a,b])=>`<div class="receipt-line"><span>${a}</span><span>${esc(b)}</span></div>`).join('')}<div class="receipt-line"><span>Base convertida</span><span>${money(Math.round(base*r.cambio*100))}</span></div><div class="receipt-line"><span>Encargos convertidos</span><span>${money(Math.round(r.encargos*r.cambio*100))}</span></div><div class="receipt-line"><strong>Custo total no arquivo</strong><strong>${money(r.total)}</strong></div><div class="receipt-line"><span>Recalculado</span><span>${money(calc)}</span></div><div class="receipt-line"><span>Diferença</span><span>${money(diff)}</span></div></article>`}

function buildShell(){const body=document.body,head=document.querySelector('header'),main=document.querySelector('main');const shell=document.createElement('div');shell.className='app-shell';const side=document.createElement('aside');side.id='sidebar';side.className='sidebar';side.innerHTML=`<div class="brand-slot"></div><button class="collapse-btn" id="collapse-side" aria-label="Recolher menu">⇤ <span class="nav-label">Recolher menu</span></button><nav aria-label="Principal" class="nav-main"><button class="nav-link" data-route="visao"><span class="nav-icon">⌂</span><span class="nav-label">Visão geral</span></button><button id="anatomy-group" aria-expanded="true" aria-controls="anatomy-links"><span class="nav-icon">⌄</span><span class="nav-label">Anatomia da operação</span></button><div id="anatomy-links" class="nav-sub"><button class="nav-link" data-route="cascata"><span class="nav-label">Do FOB ao custo em R$</span></button><button class="nav-link" data-route="importacao"><span class="nav-label">Uma importação por vez</span></button></div><button class="nav-link" data-route="importacoes"><span class="nav-icon">▤</span><span class="nav-label">Importações</span></button></nav><div class="side-bottom"><button id="theme-side" class="theme-label">Tema: Sistema</button><div class="source-side"></div></div>`;const work=document.createElement('div');work.className='workspace';work.innerHTML='<button class="mobile-menu" id="menu-open">Menu</button><div class="content-shell" id="conteudo"><p class="crumb"></p><h1 class="screen-title" tabindex="-1">Visão geral</h1></div>';const content=work.querySelector('#conteudo');content.append(main.querySelector('#banner'),main.querySelector('.filters'),main.querySelector('#app'));shell.append(side,work);body.insertBefore(shell,document.querySelector('footer'));side.querySelector('.brand-slot').append(head.querySelector('.brand'));head.querySelector('h1')?.remove();document.querySelector('.source-side').textContent=head.querySelector('#source').textContent;document.getElementById('theme-side').onclick=()=>{$('theme').click();document.getElementById('theme-side').textContent=$('theme').textContent};$('collapse-side').onclick=()=>{side.classList.toggle('collapsed');work.classList.toggle('wide');try{localStorage.setItem('gutenberg-sidebar',side.classList.contains('collapsed')?'1':'0')}catch{}};try{if(localStorage.getItem('gutenberg-sidebar')==='1'){$('collapse-side').click()}}catch{};document.getElementById('anatomy-group').onclick=e=>{const b=e.currentTarget,open=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',String(open));$('anatomy-links').hidden=!open};side.querySelectorAll('.nav-link').forEach(b=>b.onclick=()=>{goRoute(b.dataset.route);if(innerWidth<768)closeDrawer()});$('menu-open').onclick=openDrawer;window.addEventListener('hashchange',()=>{restoreRouteFilters();render()});window.__oldRenderTable=renderTable;const originalTable=renderTable;}
function openDrawer(){drawerReturnFocus=document.activeElement;const s=$('sidebar'),back=document.createElement('div');back.className='drawer-backdrop show';back.id='drawer-backdrop';document.body.append(back);s.classList.add('drawer-open');const focusables=[...s.querySelectorAll('button:not([disabled])')];focusables[0]?.focus();s.onkeydown=e=>{if(e.key==='Escape'){closeDrawer();return}if(e.key==='Tab'){const fs=[...s.querySelectorAll('button:not([disabled])')],first=fs[0],last=fs.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}};back.onclick=closeDrawer}
function closeDrawer(){$('sidebar').classList.remove('drawer-open');$('drawer-backdrop')?.remove();drawerReturnFocus?.focus()}
function loadTime(){return new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'}).format(new Date())}
function headerFields(text){const s=text.replace(/^\uFEFF/,'');let fields=[],field='',quoted=false;for(let i=0;i<s.length;i++){const c=s[i];if(quoted){if(c==='"'&&s[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===','){fields.push(field.trim());field=''}else if(c==='\n'||c==='\r'){fields.push(field.trim());break}else field+=c}return fields.map(x=>x.toLowerCase())}
function missingColumns(text){const found=new Set(headerFields(text));return headers.filter(h=>!found.has(h))}
function renderLoadError(message='As fontes automáticas não responderam. Selecione uma cópia CSV no seu dispositivo.'){const app=$('app');app.innerHTML=`<section class="card error-card" role="alert"><div class="error-mark" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 8v5m0 3h.01M10.3 3.8 2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0Z"/></svg></div><h2>Os dados ainda não chegaram</h2><p>${esc(message)}</p><div class="error-actions"><button id="retry" type="button">Tentar de novo</button></div><label class="upload-zone" id="upload-zone" for="csv-file"><strong>Carregar arquivo CSV</strong><span>Solte o arquivo aqui ou escolha no dispositivo. Ele é lido somente neste navegador.</span><input id="csv-file" name="csv-file" type="file" accept=".csv,text/csv" aria-label="Selecionar arquivo CSV"></label><p id="file-error" class="form-error" aria-live="polite"></p></section>`;$('retry').onclick=load;const input=$('csv-file'),zone=$('upload-zone');input.onchange=()=>{if(input.files?.[0])readLocalCSV(input.files[0])};['dragenter','dragover'].forEach(type=>zone.addEventListener(type,e=>{e.preventDefault();zone.classList.add('dragover')}));['dragleave','drop'].forEach(type=>zone.addEventListener(type,e=>{e.preventDefault();zone.classList.remove('dragover')}));zone.addEventListener('drop',e=>{const file=e.dataTransfer?.files?.[0];if(file)readLocalCSV(file)});}
function readLocalCSV(file){const reader=new FileReader();reader.onerror=()=>{const error=$('file-error');if(error)error.textContent='Não foi possível ler o arquivo. Escolha outro CSV.'};reader.onload=()=>{const text=String(reader.result||'');let parsed;try{const missing=missingColumns(text);if(missing.length)throw Error('Faltam colunas obrigatórias: '+missing.join(', ')+'.');parsed=parseCSV(text);if(!parsed.length)throw Error('O arquivo não contém importações válidas.')}catch(err){const error=$('file-error');if(error)error.textContent=err.message||'CSV inválido. Confira as colunas e tente novamente.';return}rows=parsed;fillFilters();restoreRouteFilters();$('source').textContent=`Fonte: Arquivo local: ${file.name} · Carregado às ${loadTime()}`;const side=document.querySelector('.source-side');if(side){side.textContent=$('source').textContent;side.dataset.state='local'}$('banner').innerHTML='';render()};reader.readAsText(file,'UTF-8')}
function setupToggleGroups(){[['ano','Ano'],['tri','Trimestre']].forEach(([id,name])=>{const select=$(id),field=select.closest('.field'),label=field.querySelector('label'),group=document.createElement('div');label.id=label.id||'label-'+id;label.removeAttribute('for');group.className='toggle-group';group.setAttribute('role','group');group.setAttribute('aria-labelledby',label.id);group.dataset.select=id;field.append(group);select.hidden=true;select.tabIndex=-1;select.setAttribute('aria-hidden','true');group.addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;const buttons=[...group.querySelectorAll('button:not(:disabled)')];if(!buttons.length)return;event.preventDefault();let index=buttons.indexOf(document.activeElement);if(event.key==='Home')index=0;else if(event.key==='End')index=buttons.length-1;else index=(index+(event.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;buttons[index].focus();buttons[index].click()})});refreshToggleGroups()}function refreshToggleGroups(){document.querySelectorAll('.toggle-group').forEach(group=>{const select=$(group.dataset.select);group.replaceChildren(...[...select.options].map(option=>{const button=document.createElement('button');button.type='button';button.textContent=group.dataset.select==='tri'?(option.value?'T'+option.value:'Todos'):(option.value||'Todos');button.setAttribute('aria-label',option.textContent);button.title=option.textContent;button.dataset.value=option.value;button.disabled=option.disabled;button.setAttribute('aria-pressed',String(select.value===option.value));button.onclick=()=>{select.value=option.value;render()};return button}))})}
