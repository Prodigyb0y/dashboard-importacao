<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custos de importação | Gutenberg Systems</title>
<meta name="description" content="Dashboard de custos de importação com dados fictícios. Recriação inspirada em um problema real de importação.">
<style>
/* ===== Tokens: única fonte de verdade de cor, tipografia, raio, sombra e espaçamento ===== */
:root{
  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-serif:Georgia,"Times New Roman",serif;
  --fs-xs:12px;--fs-sm:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:20px;--fs-2xl:28px;--fs-3xl:34px;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-pill:999px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --sw:264px;--sw-collapsed:72px;
  --ease:.15s ease;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f6efe6;--surface:#fffaf3;--surface-2:#f0e7da;--border:#e2d8c8;--border-strong:#c9bda9;
  --text:#0b0b0b;--muted:#5b5348;--accent:#d9482b;--accent-text:#b53a1f;--accent-soft:#f7d9cf;
  --blue:#2563eb;--good:#1f7a4d;--warn:#8a5a00;--crit:#b42318;
  --shadow:0 1px 2px rgba(11,11,11,.06),0 4px 14px rgba(11,11,11,.05);
  --ring:#2563eb;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c0c0c;--surface:#151515;--surface-2:#1f1f1f;--border:#2c2c2c;--border-strong:#444;
  --text:#f6efe6;--muted:#b3a99b;--accent:#ee5a3c;--accent-text:#ff8a6e;--accent-soft:#3a1a13;
  --blue:#6ea8ff;--good:#4ade80;--warn:#fbbf24;--crit:#ff8a7a;
  --shadow:0 1px 2px rgba(0,0,0,.5);
  --ring:#6ea8ff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-md)/1.5 var(--font-sans)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:var(--r-sm)}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:var(--s2) var(--s3);border-radius:var(--r-sm);z-index:100}
.skip:focus{left:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* ===== Layout ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sw);flex:none;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);padding:var(--s4) var(--s3);transition:width var(--ease);overflow:hidden;z-index:40}
.collapsed .sidebar{width:var(--sw-collapsed)}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);min-height:48px;padding:0 var(--s1)}
.brand-full{display:block;height:40px;width:auto;color:var(--text)}
.brand-full svg,.brand-icon svg{display:block;height:40px;width:auto}
.brand-icon{display:none;height:40px;width:40px}
.collapsed .brand-full{display:none}
.collapsed .brand-icon{display:block}
.collapsed .side-top{flex-direction:column;gap:var(--s3);align-items:center}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text);transition:background var(--ease)}
.icon-btn:hover{background:var(--surface-2)}
.collapsed #collapse svg{transform:rotate(180deg)}
.nav{margin:var(--s5) 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--s1);flex:1;overflow-y:auto}
.nav-label{font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:var(--s4) var(--s3) var(--s2);font-weight:700}
.collapsed .nav-label{visibility:hidden;height:var(--s3);padding:0}
.nav a{position:relative;display:flex;align-items:center;gap:var(--s3);height:44px;padding:0 var(--s3);border-radius:var(--r-md);color:var(--muted);text-decoration:none;font-weight:600;transition:background var(--ease),color var(--ease)}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a[aria-current="page"]{background:var(--surface-2);color:var(--text)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:var(--r-pill);background:var(--accent)}
.nav a[aria-current="page"] svg{color:var(--accent-text)}
.nav .label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .badge{font-size:var(--fs-xs);font-weight:700;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:var(--r-pill);padding:0 var(--s2);line-height:20px;min-width:24px;text-align:center}
.collapsed .nav .label,.collapsed .nav .badge{display:none}
.collapsed .nav a{justify-content:center;padding:0}
.side-bottom{border-top:1px solid var(--border);padding-top:var(--s3);margin-top:var(--s3);display:flex;flex-direction:column;gap:var(--s3)}
.theme-btn{display:flex;align-items:center;gap:var(--s3);height:44px;padding:0 var(--s3);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);font-weight:600;width:100%}
.theme-btn:hover{background:var(--surface-2)}
.collapsed .theme-btn{justify-content:center;padding:0}
.collapsed .theme-btn .label,.collapsed .source{display:none}
.source{font-size:var(--fs-xs);color:var(--muted);line-height:1.4;padding:0 var(--s1)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px}
.dot.warn{background:var(--warn)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);background:var(--surface);border-bottom:1px solid var(--border)}
.scrim{display:none}
.content{width:100%;max-width:1360px;margin:0 auto;padding:var(--s5) var(--s5) var(--s6)}
.page-head{margin-bottom:var(--s4)}
.crumb{font-size:var(--fs-sm);color:var(--muted);margin:0}
h1{font-family:var(--font-serif);font-size:var(--fs-3xl);line-height:1.15;margin:var(--s1) 0 var(--s2);font-weight:700;outline:none}
.lede{margin:0;color:var(--muted);max-width:70ch}

/* ===== Filtros ===== */
.filters{position:sticky;top:0;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:var(--s3) var(--s4);margin-bottom:var(--s4)}
.filter-row{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:flex-end}
.field{display:flex;flex-direction:column;gap:var(--s1);min-width:112px}
.field>label,.field>span.lbl{font-size:var(--fs-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select,.search{height:40px;padding:0 var(--s3);border-radius:var(--r-md);border:1px solid var(--border-strong);background:var(--bg);color:var(--text)}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--r-md);height:40px}
.seg button{border:0;background:transparent;border-radius:var(--r-sm);padding:0 8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.btn{height:40px;padding:0 var(--s4);border-radius:var(--r-md);border:1px solid var(--border-strong);background:var(--surface);font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.filter-note{margin:0;font-size:var(--fs-sm);color:var(--muted)}
.filter-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s3)}
.filter-foot .btn{height:34px}
.filter-toggle{display:none}

/* ===== Cards e grade ===== */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--s4)}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:var(--s5);min-width:0}
.card h2{font-family:var(--font-serif);font-size:var(--fs-xl);margin:0 0 var(--s1);line-height:1.25}
.card .sub{margin:0 0 var(--s4);color:var(--muted);font-size:var(--fs-sm)}
.kpi .lbl{font-size:var(--fs-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--font-serif);font-size:var(--fs-2xl);font-weight:700;margin:var(--s2) 0 var(--s1);line-height:1.15;overflow-wrap:anywhere}
.kpi .ctx{font-size:var(--fs-sm);color:var(--muted)}
.kpi .share{font-size:var(--fs-sm);font-weight:700;color:var(--accent-text);margin-top:var(--s2)}
details.how{margin-top:var(--s4);border-top:1px solid var(--border);padding-top:var(--s3);font-size:var(--fs-sm);color:var(--muted)}
details.how summary{cursor:pointer;font-weight:600;color:var(--text);width:fit-content}
details.how p{margin:var(--s2) 0 0}
.reads{margin:0;padding-left:var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
.warn-note{color:var(--warn);font-weight:600}

/* barras horizontais (HTML, rótulos sempre legíveis) */
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s1)}
.bar{display:grid;grid-template-columns:minmax(96px,170px) 1fr auto;align-items:center;gap:var(--s3);width:100%;background:transparent;border:0;border-radius:var(--r-sm);padding:var(--s2);text-align:left;color:var(--text)}
button.bar:hover{background:var(--surface-2)}
div.bar{cursor:default}
.bar[aria-pressed="true"]{background:var(--accent-soft)}
.bar-label{font-size:var(--fs-sm);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:12px;background:var(--surface-2);border-radius:var(--r-pill);overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--accent);border-radius:var(--r-pill)}
.bar-fill.blue{background:var(--blue)}
.bar-val{font-size:var(--fs-sm);font-variant-numeric:tabular-nums;text-align:right;min-width:112px;color:var(--text)}
.stack{display:flex;height:22px;border-radius:var(--r-sm);overflow:hidden;gap:2px;background:var(--surface)}
.stack span{display:block;min-width:2px}
.stack-row{display:grid;grid-template-columns:minmax(96px,170px) 1fr;gap:var(--s3);align-items:center;padding:var(--s2)}
.legend{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);margin:0 0 var(--s3);font-size:var(--fs-sm)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.c1{background:var(--accent)}.c2{background:var(--blue)}.c3{background:#8c8272}
.st-ok{background:var(--good)}.st-warn{background:var(--warn)}.st-crit{background:var(--crit)}
.stack-vals{font-size:var(--fs-xs);color:var(--muted);grid-column:2;margin-top:2px}

/* tabelas */
.scroll{overflow:auto;border:1px solid var(--border);border-radius:var(--r-md);max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:var(--fs-sm)}
th,td{padding:10px var(--s3);text-align:left;white-space:nowrap;border-bottom:1px solid var(--border)}
thead th{position:sticky;top:0;background:var(--surface-2);z-index:2;font-weight:700}
thead th button{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-weight:700}
thead th button:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:var(--surface-2)}
.heat td,.heat th{text-align:center}
.heat th:first-child{text-align:left}
.heat td{font-variant-numeric:tabular-nums;border-bottom:0;border-right:2px solid var(--surface);border-top:2px solid var(--surface);line-height:1.3}
.heat small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.chip{display:inline-block;border-radius:var(--r-pill);padding:2px 10px;font-size:var(--fs-xs);font-weight:700;border:1px solid currentColor}
.chip.ok{color:var(--good)}.chip.warn{color:var(--warn)}.chip.crit{color:var(--crit)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-top:var(--s3);flex-wrap:wrap;font-size:var(--fs-sm)}
.pager div{display:flex;gap:var(--s2)}
.chart-wrap{width:100%;overflow:hidden}
.axis text{font-size:12px;fill:var(--muted)}
.cascade{display:flex;flex-direction:column;gap:var(--s2)}
.cascade .row{display:grid;grid-template-columns:minmax(120px,200px) 1fr auto;gap:var(--s3);align-items:center}
.cascade .tr{height:22px;background:var(--surface-2);border-radius:var(--r-sm);position:relative}
.cascade .seg-b{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:var(--r-sm)}
.cascade .seg-b.tot{background:var(--text)}
.receipt{font-variant-numeric:tabular-nums;display:grid;grid-template-columns:1fr auto;gap:var(--s2) var(--s4);margin:var(--s4) 0 0}
.receipt dt{color:var(--muted)}.receipt dd{margin:0;text-align:right;font-weight:600}
.receipt .tot{border-top:1px solid var(--border-strong);padding-top:var(--s2);color:var(--text);font-weight:700}
.state{padding:var(--s6);text-align:center}
.state h2{margin-bottom:var(--s2)}
.state .actions{display:flex;gap:var(--s3);justify-content:center;flex-wrap:wrap;margin-top:var(--s4)}
.banner{margin:0 0 var(--s4);padding:var(--s3) var(--s4);border-radius:var(--r-md);border:1px solid var(--border-strong);background:var(--surface-2);font-size:var(--fs-sm)}
.foot{margin-top:var(--s6);padding-top:var(--s4);border-top:1px solid var(--border);font-size:var(--fs-sm);color:var(--muted)}
.skeleton{height:120px;border-radius:var(--r-lg);background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Responsivo ===== */
@media (max-width:1180px){.s3{grid-column:span 6}.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sw)!important;transform:translateX(-102%);transition:transform var(--ease);box-shadow:var(--shadow)}
  .open .sidebar{transform:none}
  .open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
  .collapsed .brand-full{display:block}.collapsed .brand-icon{display:none}
  .collapsed .nav .label,.collapsed .nav .badge{display:inline-block}
  .collapsed .nav a{justify-content:flex-start;padding:0 var(--s3)}
  .collapsed .source{display:block}
  .collapsed .theme-btn .label{display:inline}
  .collapsed .theme-btn{justify-content:flex-start;padding:0 var(--s3)}
  .collapsed .nav-label{visibility:visible;height:auto;padding:var(--s4) var(--s3) var(--s2)}
  .collapsed .side-top{flex-direction:row;align-items:center}
  #collapse{display:none}
  .topbar{display:flex;position:sticky;top:0;z-index:20}
  .content{padding:var(--s4)}
  h1{font-size:var(--fs-2xl)}
  .filters{top:64px}
}
@media (max-width:640px){
  .s3{grid-column:span 12}
  .filter-toggle{display:inline-flex;align-items:center;gap:var(--s2)}
  .filters:not(.show) .filter-row,.filters:not(.show) .filter-foot{display:none}
  .bar{grid-template-columns:minmax(72px,110px) 1fr}
  .bar-val{grid-column:1 / -1;text-align:left;padding-left:2px}
  .stack-row{grid-template-columns:1fr}
  .stack-vals{grid-column:1}
  .cascade .row{grid-template-columns:1fr auto}
  .cascade .tr{grid-column:1 / -1;order:3}
}
</style>
</head>

"use strict";
/* ================= Configuração ================= */
const SHEET_URL="https://docs.google.com/spreadsheets/d/1G8Uidlj_B9qH8sGUY4FsBWGn6F_U6-7iR92cn-Zc-DY/export?format=csv";

const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const ROUTES=[
 {id:"visao",title:"Visão geral",icon:"home",group:"Análises",lede:"Os números principais do recorte atual e o que mudou ao longo do tempo."},
 {id:"origem",title:"Origem",icon:"globe",lede:"De onde vem o custo: países, fornecedores e a composição do custo por país."},
 {id:"materiais",title:"Materiais",icon:"box",lede:"Quanto cada material pesa no custo e como ele se distribui entre os países."},
 {id:"segmentos",title:"Segmento e área",icon:"layers",lede:"Quem consome as importações: segmentos de negócio e áreas solicitantes."},
 {id:"mrp",title:"MRP e cobertura",icon:"clock",lede:"Prazo, atraso e cobertura de estoque: onde a reposição está em risco."},
 {id:"composicao",title:"Composição do custo",icon:"receipt",group:"Detalhe",lede:"Do valor FOB ao custo final em reais, e uma importação por vez."},
 {id:"importacoes",title:"Importações",icon:"table",lede:"A lista completa do recorte, com ordenação, busca e paginação."}
];

const S={rows:[],all:[],f:{pais:"",material:"",segmento:"",area:"",ano:"",tri:""},route:"visao",sort:{k:"data",d:-1},page:0,q:"",rid:"",loaded:null,source:"",sourceNote:"",error:null,theme:"light",collapsed:false,filtersOpen:false};

/* ================= Formatação (pt-BR) ================= */
const int=n=>Math.round(n).toLocaleString("pt-BR");
const brl=c=>{const neg=c<0;c=Math.abs(c);return (neg?"-":"")+"R$ "+Math.floor(c/100).toLocaleString("pt-BR")+","+String(c%100).padStart(2,"0")};
const brlC=c=>{const v=c/100;if(v>=1e9)return "R$ "+(v/1e9).toFixed(1).replace(".",",")+" bi";if(v>=1e6)return "R$ "+(v/1e6).toFixed(1).replace(".",",")+" mi";if(v>=1e3)return "R$ "+Math.round(v/1e3).toLocaleString("pt-BR")+" mil";return "R$ "+Math.round(v)};

/* ================= Dados ================= */
function parseCSV(t){
  if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===","){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);f="";if(row.length>1||row[0]!=="")rows.push(row);row=[]}
    else f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
const cents=s=>{s=String(s).trim();const neg=s[0]==="-";if(neg)s=s.slice(1);const[i,fr=""]=s.split(".");const v=Number(i)*100+Number((fr+"00").slice(0,2));return neg?-v:v};
function prepare(text){
  const t=parseCSV(text);if(t.length<2)throw new Error("O arquivo não tem linhas de dados.");
  const h=t[0].map(x=>x.trim());const miss=REQUIRED.filter(c=>!h.includes(c));
  if(miss.length)throw new Error("Colunas ausentes: "+miss.join(", "));
  const ix=Object.fromEntries(h.map((c,i)=>[c,i]));
  return t.slice(1).map(a=>{const g=k=>a[ix[k]];
    const cambio=parseFloat(g("cambio_brl_usd"));
    const fob=cents(g("fob_usd")),fr=cents(g("frete_usd")),se=cents(g("seguro_usd")),en=cents(g("encargos_usd"));
    const d=g("data"),mo=+d.slice(5,7);
    return{id:g("id"),data:d,m:d.slice(0,7),ano:d.slice(0,4),tri:String(Math.ceil(mo/3)),pais:g("pais"),fornecedor:g("fornecedor"),material:g("material"),segmento:g("segmento"),area:g("area"),
      qtd:+g("quantidade"),un:g("unidade")||"un",fob,fr,se,en,cambio,custo:cents(g("custo_total_brl")),
      fobB:Math.round(fob*cambio),frB:Math.round(fr*cambio),seB:Math.round(se*cambio),enB:Math.round(en*cambio),
      lead:+g("lead_time_planejado_dias"),atraso:+g("atraso_dias"),consumo:+g("consumo_mensal"),estoque:+g("estoque_atual"),cob:+g("cobertura_dias"),pp:+g("ponto_pedido"),status:g("status_mrp")}});
}
async function fetchText(url,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal,cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return await r.text()}finally{clearTimeout(t)}}
async function load(){
  S.error=null;render();
  let rows=null;
  try{rows=prepare(await fetchText(SHEET_URL,8000));S.source="Google Sheets";S.sourceNote="";}
  catch(e1){
    try{rows=prepare(await fetchText(LOCAL_URL,8000));S.source="cópia do repositório";S.sourceNote=/Colunas ausentes/.test(e1.message)?"A planilha está desatualizada (faltam colunas). Usando a cópia do repositório.":"Google Sheets indisponível. Usando a cópia do repositório.";}
    catch(e2){S.error="Não foi possível carregar os dados ("+e2.message+"). Você pode escolher o arquivo importacoes.csv manualmente.";rows=null}
  }
  if(rows)setData(rows);
  S.loaded=new Date();render();
}
function setData(rows){S.all=rows;S.maxDate=rows.reduce((m,r)=>r.data>m?r.data:m,"");S.minDate=rows.reduce((m,r)=>!m||r.data<m?r.data:m,"");applyFilters()}
function applyFilters(){const f=S.f;S.rows=S.all.filter(r=>(!f.pais||r.pais===f.pais)&&(!f.material||r.material===f.material)&&(!f.segmento||r.segmento===f.segmento)&&(!f.area||r.area===f.area)&&(!f.ano||r.ano===f.ano)&&(!f.tri||r.tri===f.tri))}
const uniq=k=>[...new Set(S.all.map(r=>r[k]))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
function group(rows,k){const m=new Map();for(const r of rows){const key=typeof k==="function"?k(r):r[k];let g=m.get(key);if(!g){g={key,n:0,c:0,fob:0,fr:0,se:0,en:0,at:0,atN:0,cob:0,crit:0,pp:0};m.set(key,g)}g.n++;g.c+=r.custo;g.fob+=r.fobB;g.fr+=r.frB;g.se+=r.seB;g.en+=r.enB;g.at+=r.atraso;if(r.atraso>0)g.atN++;g.cob+=r.cob;if(r.status==="Crítico")g.crit++;if(r.estoque<=r.pp)g.pp++}return[...m.values()]}
const sumC=rows=>rows.reduce((a,r)=>a+r.custo,0);

/* ================= Rótulos de período e filtro ================= */
function periodText(){const f=S.f;const a=S.minDate?mLabel(S.minDate):"",b=S.maxDate?mLabel(S.maxDate):"";
  if(f.ano&&f.tri){const m=(+f.tri-1)*3;return `${f.tri}º trimestre de ${f.ano} (${MESES[m]}–${MESES[m+2]}/${f.ano.slice(2)})`}
  if(f.ano)return "ano "+f.ano;if(f.tri)return `${f.tri}º trimestre, todos os anos`;return `${a} a ${b}`}
function filterText(){const p=[];for(const[k,l]of FILTERS)if(S.f[k])p.push(l.toLowerCase()+" "+S.f[k]);return p.length?p.join(" · "):"nenhum"}
const nActive=()=>Object.values(S.f).filter(Boolean).length;
const ctx=()=>`${periodText()} · filtro: ${filterText()}`;

/* ================= Componentes ================= */
function bars(items,{key,fmt,cls="",max}){
  const m=max||Math.max(1,...items.map(i=>i.v));
  return `<ul class="bars">${items.map(i=>{
    const on=key&&S.f[key]===i.key;
    const inner=`<span class="bar-label" title="${esc(i.label)}">${esc(i.label)}</span><span class="bar-track"><span class="bar-fill ${cls}" style="width:${Math.max(.8,i.v/m*100).toFixed(1)}%"></span></span><span class="bar-val">${i.text}</span>`;
    return `<li>${key?`<button type="button" class="bar" data-f="${key}" data-v="${esc(i.key)}" aria-pressed="${on}" title="${on?"Remover filtro":"Filtrar por"} ${esc(i.label)}">${inner}</button>`:`<div class="bar">${inner}</div>`}</li>`}).join("")}</ul>`}
function heat(rowsKey,colsKey,rows,rl,cl){
  const g=group(rows,r=>r[rowsKey]+"||"+r[colsKey]);const map=new Map(g.map(x=>[x.key,x]));
  const rs=[...new Set(rows.map(r=>r[rowsKey]))].sort((a,b)=>a.localeCompare(b,"pt-BR")),cs=[...new Set(rows.map(r=>r[colsKey]))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  const mx=Math.max(1,...g.map(x=>x.c));
  return `<div class="scroll"><table class="heat"><caption class="sr">${esc(rl)} por ${esc(cl)}: custo total e número de importações</caption><thead><tr><th scope="col">${esc(rl)} / ${esc(cl)}</th>${cs.map(c=>`<th scope="col">${esc(c)}</th>`).join("")}</tr></thead><tbody>${rs.map(r=>`<tr><th scope="row">${esc(r)}</th>${cs.map(c=>{const x=map.get(r+"||"+c);if(!x)return `<td>—</td>`;const a=Math.round(x.c/mx*55);return `<td style="background:color-mix(in srgb,var(--accent) ${a}%,var(--surface))">${brlC(x.c)}<small>n = ${x.n}${x.n<15?" · n baixo":""}</small></td>`}).join("")}</tr>`).join("")}</tbody></table></div>`}
const how=t=>`<details class="how"><summary>Como calculado</summary><p>${t}</p></details>`;
const card=(cls,title,sub,body,h)=>`<section class="card ${cls}"><h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:""}${body}${h?how(h):""}</section>`;
function kpi(cls,label,value,sub,share,h){return `<section class="card kpi ${cls}"><div class="lbl">${label}</div><div class="val">${value}</div><div class="ctx">${sub}</div>${share?`<div class="share">${share}</div>`:""}${h?how(h):""}</section>`}
function shareLine(c){const t=sumC(S.all);return nActive()?`${pct(c,t)} do total geral (${brlC(t)})`:"100,0% do total geral, sem filtros"}
function stackBar(parts,total,classes){const t=total||parts.reduce((a,b)=>a+b.v,0)||1;return `<div class="stack">${parts.map((p,i)=>`<span class="${classes[i]}" style="width:${(p.v/t*100).toFixed(2)}%" title="${esc(p.l)}: ${p.t}"></span>`).join("")}</div>`}

/* ================= Telas ================= */
function trend(rows){
  const all=[...new Set(S.all.map(r=>r.m))].sort();const g=new Map(group(rows,"m").map(x=>[x.key,x]));
  const last=S.maxDate,partial=last&&(+last.slice(8,10)<new Date(+last.slice(0,4),+last.slice(5,7),0).getDate());const lm=last?last.slice(0,7):"";
  const vals=all.map(m=>({m,c:g.get(m)?.c||0,n:g.get(m)?.n||0,p:partial&&m===lm}));
  const W=Math.max(320,Math.min(900,($("#view")?.clientWidth||800)-48)),H=270,L=76,Bt=34,T=12,R=8,iw=W-L-R,ih=H-Bt-T;
  const max=Math.max(1,...vals.map(v=>v.c)),top=niceMax(max);
  const bw=iw/vals.length;
  const ma=vals.map((v,i)=>i>=2&&!v.p&&!vals[i-1].p?Math.round((vals[i].c+vals[i-1].c+vals[i-2].c)/3):null);
  const y=c=>T+ih-(c/top)*ih;
  const step=Math.ceil(vals.length/(iw<500?6:12));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Custo total por mês, em reais, com média móvel de 3 meses"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--surface)"/><rect width="3" height="6" fill="var(--accent)"/></pattern></defs><g class="axis">`;
  for(const t of [0,.5,1]){const c=top*t;s+=`<line x1="${L}" x2="${W-R}" y1="${y(c)}" y2="${y(c)}" stroke="var(--border)"/><text x="${L-8}" y="${y(c)+4}" text-anchor="end">${c?brlC(c):"R$ 0"}</text>`}
  vals.forEach((v,i)=>{const x=L+i*bw+bw*.18,w=bw*.64,h=(v.c/top)*ih;s+=`<rect x="${x.toFixed(1)}" y="${(T+ih-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${v.p?"url(#hatch)":"var(--accent)"}" ${v.p?'stroke="var(--accent)"':""}><title>${mLabel(v.m)}: ${brl(v.c)} · ${v.n} importações${v.p?" (mês parcial)":""}</title></rect>`;
    if(i%step===0)s+=`<text x="${(x+w/2).toFixed(1)}" y="${H-12}" text-anchor="middle">${mLabel(v.m)}${v.p?"*":""}</text>`});
  const pts=ma.map((v,i)=>v==null?null:[L+i*bw+bw/2,y(v)]).filter(Boolean);
  if(pts.length>1)s+=`<polyline fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ")}"/>`;
  s+=`</g></svg>`;
  const tbl=`<details class="how"><summary>Ver como tabela</summary><div class="scroll"><table><thead><tr><th>Mês</th><th class="n">Importações</th><th class="n">Custo total (R$)</th></tr></thead><tbody>${vals.map(v=>`<tr><td>${mLabel(v.m)}${v.p?" (parcial)":""}</td><td class="n">${v.n}</td><td class="n">${brl(v.c)}</td></tr>`).join("")}</tbody></table></div></details>`;
  const lg=`<div class="legend"><span><i class="c1"></i>Custo mensal (R$)</span><span><i class="c2"></i>Média móvel de 3 meses</span>${partial?`<span>* mês parcial, dados até ${dBR(last)}</span>`:""}</div>`;
  return lg+`<div class="chart-wrap">${s}</div>`+tbl;
}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,1.5,2,2.5,3,4,5,6,8,10])if(m*p>=v)return m*p;return 10*p}
function readings(rows){
  const o=[],n=rows.length;if(!n)return o;
  if(n<20)o.push(`<span class="warn-note">Amostra pequena (n = ${n}): leia as proporções com cautela.</span>`);
  const tot=sumC(rows);
  const by=k=>group(rows,k).sort((a,b)=>b.c-a.c);
  const m=by("material")[0],p=by("pais"),sg=by("segmento")[0];
  if(!S.f.material&&m)o.push(`O material ${esc(m.key)} responde por ${pct(m.c,tot)} do custo.`);
  if(!S.f.pais&&p.length>=3)o.push(`Os 3 maiores países somam ${pct(p.slice(0,3).reduce((a,b)=>a+b.c,0),tot)} do custo; ${esc(p[0].key)} lidera com ${pct(p[0].c,tot)}.`);
  if(!S.f.segmento&&sg)o.push(`O segmento ${esc(sg.key)} é o maior consumidor, com ${pct(sg.c,tot)} do custo.`);
  const ms=[...group(rows,"m")].sort((a,b)=>a.key<b.key?-1:1);const lm=S.maxDate.slice(0,7);const comp=ms.filter(x=>x.key!==lm);
  if(comp.length>=6){const l3=comp.slice(-3),a=l3.reduce((s,x)=>s+x.c,0),b=comp.slice(-6,-3).reduce((s,x)=>s+x.c,0);if(b){const v=Math.abs((a-b)/b*100).toFixed(1).replace(".",",");o.push(`Nos últimos 3 meses completos (${mLabel(l3[0].key)} a ${mLabel(l3[2].key)}) o custo foi ${v}% ${a>=b?"maior":"menor"} que nos 3 meses anteriores.`)}}
  const big=rows.reduce((a,r)=>r.custo>a.custo?r:a,rows[0]);o.push(`A maior importação (${esc(big.id)}) custou ${brl(big.custo)}, ${pct(big.custo,tot)} do total do recorte.`);
  const cr=rows.filter(r=>r.status==="Crítico").length;o.push(`${pct(cr,n)} dos pedidos entraram em status crítico de MRP (cobertura menor que o prazo planejado).`);
  return o}
function viewVisao(rows){
  const n=rows.length,c=sumC(rows),paises=new Set(rows.map(r=>r.pais)).size;
  const at=rows.reduce((a,r)=>a+r.atraso,0),atN=rows.filter(r=>r.atraso>0).length,cob=rows.reduce((a,r)=>a+r.cob,0),cr=rows.filter(r=>r.status==="Crítico").length;
  const cx=ctx();
  const gp=group(rows,"pais").sort((a,b)=>b.c-a.c);
  return `<div class="grid">
  ${kpi("s3","Custo total",brl(c),cx,shareLine(c),"Soma de <code>custo_total_brl</code> das importações do recorte, em centavos inteiros. Cada linha: (FOB + frete + seguro + encargos) × câmbio, arredondado a 2 casas.")}
  ${kpi("s3","Importações",int(n),cx,nActive()?`${pct(n,S.all.length)} das ${int(S.all.length)} importações`:"100,0% das importações, sem filtros","Contagem de linhas do recorte.")}
  ${kpi("s3","Custo médio por importação",n?brl(Math.round(c/n)):"—",cx,"custo total ÷ importações","Custo total ÷ número de importações, arredondado ao centavo.")}
  ${kpi("s3","Custo médio por país",paises?brl(Math.round(c/paises)):"—",cx,`custo total ÷ ${paises} país(es) com dados`,"Custo total ÷ número de países com ao menos uma importação no recorte.")}
  ${kpi("s3","Atraso médio",tenth(at,n)+" dias",cx,`${pct(atN,n)} dos pedidos chegaram atrasados`,"Média de <code>atraso_dias</code>, arredondada a 1 casa (meio para cima). Pedido atrasado: atraso maior que zero.")}
  ${kpi("s3","Cobertura média",tenth(cob,n)+" dias",cx,"estoque na data do pedido","Média de <code>cobertura_dias</code> (dias de estoque no momento do pedido), 1 casa.")}
  ${kpi("s3","Pedidos em status crítico",int(cr),cx,`${pct(cr,n)} do recorte`,"Status crítico: cobertura em dias menor que o lead time planejado do país de origem.")}
  ${kpi("s3","Maior país",gp[0]?esc(gp[0].key):"—",cx,gp[0]?`${brlC(gp[0].c)} · ${pct(gp[0].c,c)} do recorte`:"","País com maior custo total no recorte.")}
  ${card("s8","Tendência mensal","Custo total (R$) por mês, com média móvel de 3 meses. Eixo iniciado em zero.",trend(rows),"Soma mensal de <code>custo_total_brl</code> por mês da data do pedido. Média móvel: média do mês e dos 2 anteriores; não é calculada para o mês parcial.")}
  ${card("s4","Leituras","Regras determinísticas aplicadas ao recorte atual, sem IA.",`<ul class="reads">${readings(rows).map(x=>`<li>${x}</li>`).join("")}</ul>`,"Frases geradas por regras fixas (participação, comparação de trimestres móveis, maior valor). Sem modelo de linguagem.")}
  ${card("s6","Custo por país","Custo total (R$) e participação no recorte. Clique para filtrar.",bars(gp.map(x=>({label:x.key,key:x.key,v:x.c,text:`${brlC(x.c)} · ${pct(x.c,c)}`})),{key:"pais"}),"Soma de <code>custo_total_brl</code> por país; participação = parte ÷ total do recorte.")}
  ${card("s6","Custo por segmento","Custo total (R$) e participação no recorte. Clique para filtrar.",bars(group(rows,"segmento").sort((a,b)=>b.c-a.c).map(x=>({label:x.key,key:x.key,v:x.c,text:`${brlC(x.c)} · ${pct(x.c,c)}`})),{key:"segmento"}),"Soma de <code>custo_total_brl</code> por segmento.")}
  </div>`}
function viewOrigem(rows){
  const c=sumC(rows),gp=group(rows,"pais").sort((a,b)=>b.c-a.c);
  const forn=group(rows,"fornecedor").sort((a,b)=>b.c-a.c).slice(0,10);const topSum=forn.slice(0,5).reduce((a,b)=>a+b.c,0);
  const comp=gp.map(x=>{const rest=x.c-x.fob-x.fr-x.se-x.en;return `<div class="stack-row"><span class="bar-label">${esc(x.key)}</span><div>${stackBar([{l:"Mercadoria (FOB)",v:x.fob,t:pct(x.fob,x.c)},{l:"Frete e seguro",v:x.fr+x.se,t:pct(x.fr+x.se,x.c)},{l:"Encargos",v:x.en,t:pct(x.en,x.c)}],x.fob+x.fr+x.se+x.en,["c1","c2","c3"])}<div class="stack-vals">FOB ${pct(x.fob,x.fob+x.fr+x.se+x.en)} · frete e seguro ${pct(x.fr+x.se,x.fob+x.fr+x.se+x.en)} · encargos ${pct(x.en,x.fob+x.fr+x.se+x.en)}</div></div></div>`}).join("");

function viewMrp(rows){
  const n=rows.length,gp=group(rows,"pais").sort((a,b)=>b.at/b.n-a.at/a.n),gm=group(rows,"material").sort((a,b)=>b.crit/b.n-a.crit/a.n);

  ${card("s6","Prazo planejado e efetivo por país","Lead time planejado e atraso médio observado. Efetivo = planejado + atraso médio.",bars(gp.map(x=>({label:x.key,key:x.key,v:(leadOf[x.key]*10+Math.round(x.at*10/x.n)),text:`planejado ${leadOf[x.key]} d · atraso ${tenth(x.at,x.n)} d`})),{key:"pais",cls:"blue",max:Math.max(...gp.map(x=>leadOf[x.key]*10+Math.round(x.at*10/x.n)))*1.02}),"Lead time planejado fixo por país. Atraso médio: média de <code>atraso_dias</code>. A barra mostra o prazo efetivo (planejado + atraso médio).")}
  ${card("s12","10 pedidos mais críticos","Pedidos em status crítico com a maior folga negativa (cobertura − lead time).",`<div class="scroll"><table><thead><tr><th>ID</th><th>Data</th><th>Material</th><th>País</th><th class="n">Cobertura (d)</th><th class="n">Lead time (d)</th><th class="n">Folga (d)</th><th class="n">Atraso (d)</th><th class="n">Estoque</th><th class="n">Ponto de pedido</th></tr></thead><tbody>${worst.map(r=>`<tr><td>${esc(r.id)}</td><td>${dBR(r.data)}</td><td>${esc(r.material)}</td><td>${esc(r.pais)}</td><td class="n">${r.cob}</td><td class="n">${r.lead}</td><td class="n">${r.cob-r.lead}</td><td class="n">${r.atraso}</td><td class="n">${int(r.estoque)} ${esc(r.un)}</td><td class="n">${int(r.pp)} ${esc(r.un)}</td></tr>`).join("")||`<tr><td colspan="10">Nenhum pedido crítico no recorte.</td></tr>`}</tbody></table></div>`,"Folga = cobertura_dias − lead_time_planejado_dias. Lista os 10 menores valores entre os pedidos críticos, desempate por ID.")}

function viewComposicao(rows){
  const c=sumC(rows),fob=rows.reduce((a,r)=>a+r.fobB,0),fr=rows.reduce((a,r)=>a+r.frB,0),se=rows.reduce((a,r)=>a+r.seB,0),en=rows.reduce((a,r)=>a+r.enB,0),res=c-fob-fr-se-en;
  const steps=[["Mercadoria (FOB)",fob,0],["+ Frete",fr,fob],["+ Seguro",se,fob+fr],["+ Encargos",en,fob+fr+se],["± Arredondamento linha a linha",res,fob+fr+se+en],["= Custo total",c,0,true]];
  const mx=Math.max(c,1);
  const top=[...rows].sort((a,b)=>b.custo-a.custo).slice(0,100);
  if(!S.rid||!rows.find(r=>r.id===S.rid))S.rid=top[0]?.id||"";
  const r=rows.find(x=>x.id===S.rid);
  const rc=r?`<dl class="receipt"><dt>FOB</dt><dd>${usd(r.fob)}</dd><dt>+ Frete</dt><dd>${usd(r.fr)}</dd><dt>+ Seguro</dt><dd>${usd(r.se)}</dd><dt>= Base de cálculo</dt><dd>${usd(r.fob+r.fr+r.se)}</dd><dt>+ Encargos (II + IPI + PIS/COFINS fictícios)</dt><dd>${usd(r.en)}</dd><dt>= Total em dólar</dt><dd>${usd(r.fob+r.fr+r.se+r.en)}</dd><dt>× Câmbio do mês</dt><dd>${r.cambio.toFixed(4).replace(".",",")}</dd><dt class="tot">Custo total (R$)</dt><dd class="tot">${brl(r.custo)}</dd></dl>`:"";
  return `<div class="grid">
  ${card("s7","Do FOB ao custo em reais",ctx(),`<div class="cascade">${steps.map(([l,v,off,tot])=>`<div class="row"><span class="bar-label">${l}</span><div class="tr"><span class="seg-b ${tot?"tot":""}" style="left:${(off/mx*100).toFixed(2)}%;width:${Math.max(.4,Math.abs(v)/mx*100).toFixed(2)}%"></span></div><span class="bar-val">${brl(v)}</span></div>`).join("")}</div>`,"Cada componente em USD × câmbio da linha, somado em centavos. Custo total = soma de <code>custo_total_brl</code>. A linha de arredondamento é a diferença entre os dois (centavos).")}
  ${card("s5","Uma importação por vez","Escolha uma das 100 maiores importações do recorte para ver a conta completa.",`<div class="field"><label for="rid">Importação</label><select id="rid">${top.map(x=>`<option value="${esc(x.id)}" ${x.id===S.rid?"selected":""}>${esc(x.id)} · ${dBR(x.data)} · ${esc(x.pais)} · ${esc(x.material)}</option>`).join("")}</select></div>${rc}`,"Valores da própria linha do CSV: FOB, frete, seguro e encargos em USD; custo total = (FOB + frete + seguro + encargos) × câmbio.")}
  </div>`}
const COLS=[["id","ID"],["data","Data"],["pais","País"],["fornecedor","Fornecedor"],["material","Material"],["segmento","Segmento"],["area","Área"],["qtd","Quantidade",1],["fob","FOB (US$)",1],["cambio","Câmbio",1],["en","Encargos (US$)",1],["custo","Custo total (R$)",1],["atraso","Atraso (d)",1],["cob","Cobertura (d)",1],["status","Status MRP"]];

const VIEWS={visao:viewVisao,origem:viewOrigem,materiais:viewMateriais,segmentos:viewSegmentos,mrp:viewMrp,composicao:viewComposicao,importacoes:viewImportacoes};

/* ================= Filtros, sidebar e render ================= */
function filterBar(){
  const sel=([k,l])=>`<div class="field"><label for="f-${k}">${l}</label><select id="f-${k}" data-filter="${k}"><option value="">Todos</option>${uniq(k).map(v=>`<option ${S.f[k]===v?"selected":""}>${esc(v)}</option>`).join("")}</select></div>`;
  const seg=(k,l,opts)=>`<div class="field"><span class="lbl" id="l-${k}">${l}</span><div class="seg" role="group" aria-labelledby="l-${k}">${opts.map(([v,t,al])=>`<button type="button" data-seg="${k}" data-v="${v}" aria-pressed="${S.f[k]===v}" ${al?`aria-label="${al}"`:""}>${t}</button>`).join("")}</div></div>`;
  const years=[...new Set(S.all.map(r=>r.ano))].sort();
  return `<section class="filters ${S.filtersOpen?"show":""}" aria-label="Filtros"><button type="button" class="btn filter-toggle" id="ftoggle" aria-expanded="${S.filtersOpen}">Filtros${nActive()?` (${nActive()} ativos)`:""}</button><div class="filter-row">${FILTERS.map(sel).join("")}${seg("ano","Ano",[["","Todos"],...years.map(y=>[y,y])])}${seg("tri","Trimestre",[["","Todos"],...["1","2","3","4"].map(t=>[t,"T"+t,t+"º trimestre"])])}</div><div class="filter-foot"><p class="filter-note long" aria-live="polite">Período: ${periodText()} · Filtro: ${filterText()} · ${int(S.rows.length)} de ${int(S.all.length)} importações</p><button type="button" class="btn" id="clear">Limpar filtros</button></div></section>`}
function nav(){
  let h="",g="";
  for(const r of ROUTES){
    if(r.group&&r.group!==g){g=r.group;h+=`<li class="nav-label" aria-hidden="true">${g}</li>`}
    let badge="";if(r.id==="importacoes")badge=int(S.rows.length);if(r.id==="mrp")badge=int(S.rows.filter(x=>x.status==="Crítico").length);
    h+=`<li><a href="#/${r.id}" data-route="${r.id}" title="${r.title}" ${S.route===r.id?'aria-current="page"':""}>${ico(r.icon)}<span class="label">${r.title}</span>${badge?`<span class="badge" aria-label="${badge}${r.id==="mrp"?" pedidos críticos":" importações"}">${badge}</span>`:""}</a></li>`}
  $("#nav").innerHTML=h}
function shell(){
  nav();
  $("#theme-ico").innerHTML=ico(S.theme==="dark"?"sun":"moon");$("#theme-label").textContent=S.theme==="dark"?"Tema claro":"Tema escuro";
  $("#app-shell").classList.toggle("collapsed",S.collapsed);
  const b=$("#collapse");b.setAttribute("aria-expanded",String(!S.collapsed));b.setAttribute("aria-label",S.collapsed?"Expandir menu":"Recolher menu");b.title=b.getAttribute("aria-label");
  $("#source").innerHTML=S.source?`<span class="dot ${S.sourceNote?"warn":""}"></span>Fonte: ${S.source}${S.loaded?" · "+S.loaded.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):""}`:"Carregando dados…";
}
function render(){
  const route=ROUTES.find(r=>r.id===S.route)||ROUTES[0];
  document.title=`${route.title} | Gutenberg Systems`;$("#topbar-title").textContent=route.title;
  shell();
  const v=$("#view");
  if(S.error){v.innerHTML=`<header class="page-head"><p class="crumb">Custos de importação</p><h1 tabindex="-1">Não foi possível carregar os dados</h1></header><section class="card state" role="alert"><h2>Erro ao carregar o CSV</h2><p>${esc(S.error)}</p><div class="actions"><button class="btn primary" id="retry" type="button">Tentar novamente</button><label class="btn" for="csv" style="display:inline-flex;align-items:center">Escolher arquivo CSV</label><input id="csv" class="sr" type="file" accept=".csv,text/csv"></div></section>`;return}
  if(!S.all.length){v.innerHTML=`<div class="skeleton" aria-busy="true"></div>`;return}
  const head=`<header class="page-head"><p class="crumb">Custos de importação</p><h1 tabindex="-1" id="title">${route.title}</h1><p class="lede">${route.lede}</p></header>`;
  const banner=S.sourceNote?`<p class="banner" role="status">${esc(S.sourceNote)}</p>`:"";
  let body;
  if(!S.rows.length)body=`<section class="card state"><h2>Nenhum resultado para os filtros</h2><p>${ctx()}. Remova algum filtro para voltar a ver dados.</p><div class="actions"><button class="btn primary" type="button" id="clear2">Limpar filtros</button></div></section>`;
  else body=VIEWS[S.route](S.rows);
  const keepFocus=document.activeElement&&document.activeElement.id;
  v.innerHTML=head+banner+filterBar()+body;
  if(keepFocus){const e=document.getElementById(keepFocus);if(e&&e.focus&&!["title"].includes(keepFocus)){e.focus();if(e.setSelectionRange&&e.type==="search"){const l=e.value.length;e.setSelectionRange(l,l)}}}
}
function go(id,focus){
  if(!ROUTES.find(r=>r.id===id))id="visao";
  S.route=id;S.page=0;render();
  safe(()=>{if(location.hash!=="#/"+id)history.replaceState(null,"","#/"+id)}); // sandbox/srcdoc pode recusar: o estado já está em memória
  if(focus){const t=document.getElementById("title");if(t)t.focus({preventScroll:true});window.scrollTo(0,0)}
}
function setFilter(k,v){S.f[k]=v;S.page=0;applyFilters();render()}
function setTheme(t){S.theme=t;document.documentElement.dataset.theme=t;safe(()=>localStorage.setItem("gs-theme",t));shell();render()}

/* ================= Eventos (delegação) ================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a");if(!t)return;
  if(t.id==="collapse"){S.collapsed=!S.collapsed;safe(()=>localStorage.setItem("gs-collapsed",S.collapsed?"1":"0"));shell();return}
  if(t.id==="menu"){$("#app-shell").classList.add("open");return}
  if(t.id==="theme"){setTheme(S.theme==="dark"?"light":"dark");return}
  if(t.id==="retry"){load();return}
  if(t.id==="clear"||t.id==="clear2"){S.f={pais:"",material:"",segmento:"",area:"",ano:"",tri:""};S.q="";applyFilters();render();return}
  if(t.id==="ftoggle"){S.filtersOpen=!S.filtersOpen;render();return}
  if(t.dataset.route){e.preventDefault();$("#app-shell").classList.remove("open");go(t.dataset.route,true);return}
  if(t.dataset.seg){setFilter(t.dataset.seg,t.dataset.v);return}
  if(t.dataset.f){setFilter(t.dataset.f,S.f[t.dataset.f]===t.dataset.v?"":t.dataset.v);return}
  if(t.dataset.sort){const k=t.dataset.sort;S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:1};S.page=0;render();return}
  if(t.dataset.page){S.page+=+t.dataset.page;render();return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.filter){setFilter(t.dataset.filter,t.value);return}
  if(t.id==="rid"){S.rid=t.value;render();return}
  if(t.id==="csv"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{S.source="arquivo local";S.sourceNote="Dados carregados manualmente do arquivo "+t.files[0].name+".";S.error=null;setData(prepare(fr.result));S.loaded=new Date();render()}catch(err){S.error="Arquivo inválido: "+err.message;render()}};fr.readAsText(t.files[0],"utf-8")}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;S.page=0;render()}});
$("#scrim").addEventListener("click",()=>$("#app-shell").classList.remove("open"));
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#app-shell").classList.remove("open")});
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.route==="visao"&&S.rows.length)render()},150)});
safe(()=>window.addEventListener("hashchange",()=>{const id=location.hash.replace(/^#\/?/,"");if(ROUTES.find(r=>r.id===id)&&id!==S.route){S.route=id;S.page=0;render()}}));

/* ================= Início ================= */
(function init(){
  const st=safe(()=>localStorage.getItem("gs-theme"));
  S.theme=st||(safe(()=>matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light");
  document.documentElement.dataset.theme=S.theme;
  S.collapsed=safe(()=>localStorage.getItem("gs-collapsed"))==="1";
  const id=safe(()=>location.hash.replace(/^#\/?/,""));if(id&&ROUTES.find(r=>r.id===id))S.route=id;
  load();
})();
</script>
</body>
